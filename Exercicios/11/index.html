<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
   <h1>Imagem dinâmica</h1>
   <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumenre e diminua o tamanho do seu navegador.</p>
   <picture>
        <source media="(max-width: 750px)" srcset="imagens/300x300.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/700x700.png" type="image/png">
        <img src="imagens/Desktop 1000x1000.png" alt="Imagens flexível">
   </picture>
   <h1>Reproduzindo Áudios</h1>
   <p>Vamos aprender a reproduzir áudios em HTML5.</p>
   <audio preload="metadata" autoplay controls loop>
        <source src="midia/triburtina-schwartzy.mp3" type="audio/mpeg">
        <source src="midia/triburtina-schwartz.ogg" type="audio/ogg">
        <source src="midia/triburtina-schwartzy.wav" type="audio/wav">
        <p>Infelizmente seu navegador náo consegue reproduzir áudio. <a href="midia/triburtina-schwartzy.mp3">Clique aqui para baixar o arquivo MP3</a></p>
   </audio>
   
</body>
</html>
