<!DOCTYPE html>
<html lang="pt-br">

    <style>
        @font-face {
            font-family: 'Love';
            src: url('Mf Love Song.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de formatos
            opentype
            truetype
            embedded-opentype

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
