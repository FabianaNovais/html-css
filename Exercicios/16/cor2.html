<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cor gradientes em CSS</title>
    <style>
        * {
            height: 100%;
        }
        body{
            background-image: linear-gradient(to bottom, #74B0A2, #3A8D7A, #3A8D7A, #083329);
            background-attachment: fixed;
        }
        h1 {
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
