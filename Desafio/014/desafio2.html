<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela - Parte 2</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        border-collapse: collapse;
        width: 600px;
    }

    td, th {
        border:  1.5px solid palevioletred;
        padding: 25px;
    }
    caption {
        font-size: 1.5em;
        font-weight: bolder;
        padding: 20px;
        background-color: rgb(255, 218, 225);
    }

    .media {
        background-color: rgb(255, 218, 225);
        font-size: 1.5em;
        font-weight: bold;
        text-align: left;
        
    }
</style>
</head>

            </tr>
            <tr>
                <th colspan="4" class="media" scope="colgroup">Média de Exatas</th>
                <td class="media">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>

</html>
